name: Build static Qt

# 编出 Coast 用的静态 Qt，发成**本仓库**的 release 资产。
#
# 注：2026-08-08 clashauto 的静态 Qt 改动合入 master 之前，本 workflow 拉到的是旧版 action
# （没有 complete 输出、Windows 脚本也没有 Ninja 修复）。表现极具迷惑性：三套 Qt 都**编译成功**、
# job 全绿，但 Publish 一律 skipped —— 因为 `steps.qt.outputs.complete` 在旧 action 里根本不存在，
# 空值 != 'true'。白编了一整轮。实际执行的是 checkout 下来那个 ref 上的 action —— 现在是
# Coast 的 main（配方镜像，见下文），clashauto 那边改了配方要先重跑生成器推到 Coast 才算数。
#
# ★ 为什么构建放在这边、而不是 clashauto 那边：
#   反过来做（clashauto 编好再跨仓库写过来）需要一个对本仓库有 contents:write 的 PAT，
#   得有人去建、去存成 secret、到期还要轮换。放在本仓库里，用 Actions 自带的 GITHUB_TOKEN
#   就能发自己的 release —— **不需要任何 PAT 或 secret**，也就没有凭据过期这回事。
#   clashauto 那边只匿名下载公开资产，同样不需要凭据。
#
# ★ 配方（模块集、configure flag、断点续编逻辑）**只有一份**，在 clashauto 里：
#   .github/actions/qt-static/。本仓库不保存任何副本 —— 两份配方迟早会漂移，而漂移的表现是
#   「编出来的 Qt 和 app 期待的不一致」，那种问题查起来极贵。
#
# ★★ 但**不再直接 checkout clashauto**（2026-09-28 改）。clashauto 2026-08 转了私有，
#    这里用自带的 GITHUB_TOKEN 去 checkout 恒挂 `repository … not found`，定时任务从
#    08-17 起每周红一次。给这里配一个能读 clashauto 的 PAT 就违背了上面「不需要任何
#    PAT / secret」那条，于是反过来：clashauto 的 gen_coast_workflow.py 把配方**逐字节**
#    镜像进公开的 ClashrAuto/Coast（与 Coast 的两个 workflow 同一次生成、同一道门禁
#    generated_files_check.py），这里 checkout Coast、uses 那份镜像。
#    逐字节是硬要求：资产名里的短哈希按 $GITHUB_ACTION_PATH 下的配方脚本（去 CR）算，
#    镜像与源一个字节不差，哈希就与 clashauto 那侧下载时要找的名字一致。
#
# ★ Windows 两套一轮编不完 GitHub 的 6 小时上限，靠断点续编分几轮推进（进度存 Actions 缓存）。
#   本 workflow **故意不设并发组**：被后一次运行取消掉的 job 跑不到回写缓存那一步，
#   于是「边编边被取消」= 每轮都白烧、进度一次也存不下来。反复手动跑，直到出资产为止。

on:
  # ★ 只在**本文件自己**被改动时触发。理由有两条：
  #   · 配方或本 workflow 一变，原有资产就该重编（资产名里的哈希也会跟着变）；
  #   · 但改 README 之类不该烧掉五个长 job，所以用 paths 卡死。
  #   平时要补编（比如 Windows 断点续编的后续几轮），到 Actions 里点 Run workflow。
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      qt-version:
        description: >-
          Qt 版本。**留空 = 按平台取默认值**（见矩阵里的 qt:）——Windows/macOS 6.11.1、
          Linux 6.8.3，与 clashauto 的 QT_VERSION / QT_VERSION_LINUX 一一对应。
          填了就五套一起用这个值，只在临时试某个版本时才该填。
        required: false
        default: ''
      targets:
        description: 只编哪几套（逗号分隔，留空 = 全部五套）
        required: false
        default: ''
  schedule:
    # 每周一 04:23 UTC。作用有两个：把 Windows 那两套断点续编一轮轮推完；
    # 以及在 clashauto 改了配方（资产名里的哈希会变）之后自动补上新资产。
    # 错开整点，避开 GitHub 定时任务高峰。
    - cron: '23 4 * * 1'

permissions:
  contents: write   # 发布 release 资产用的就是这一条，除此之外不需要任何权限

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    # 一套挂了不该拖累其余四套：五套之间没有任何依赖，各自独立发资产。
    strategy:
      fail-fast: false
      matrix:
        include:
          # qt: 与 clashauto 的 release.yml 必须一一对应（Windows/macOS 用 QT_VERSION，
          # Linux 用 QT_VERSION_LINUX）。对不上不会报错 —— 只会让那边永远找不到预编产物，
          # 每次发布都从源码编一遍。
          - target: windows-x64
            runner: windows-2022
            qt: 6.11.1
          - target: windows-arm64
            runner: windows-2022
            qt: 6.11.1
          - target: linux-x64
            runner: ubuntu-22.04
            qt: 6.8.3
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            qt: 6.8.3
          - target: macos-universal
            runner: macos-14
            qt: 6.11.1
    timeout-minutes: 350

    steps:
      - name: 该不该编这一套
        id: want
        shell: bash
        env:
          ONLY: ${{ github.event.inputs.targets }}
        run: |
          set -euo pipefail
          if [ -z "${ONLY:-}" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          case ",${ONLY// /}," in
            *",${{ matrix.target }},"*) echo "go=true"  >> "$GITHUB_OUTPUT";;
            *)                          echo "go=false" >> "$GITHUB_OUTPUT"; echo "跳过 ${{ matrix.target }}";;
          esac

      - name: Checkout Coast（配方的公开镜像，源在 clashauto）
        if: steps.want.outputs.go == 'true'
        uses: actions/checkout@v4
        with:
          repository: ClashrAuto/Coast
          ref: main
          path: coast
          # 公开仓库，不需要 token。★ 别改回 checkout clashauto —— 那边是私有仓库，
          #   见文件头「不再直接 checkout clashauto」那段。

      # 宿主 Qt 那一步没了：windows-arm64 交叉编译要的同版本宿主 Qt 由 qt-static action
      # 自己解析（取同版本同配方的 windows-x64 静态 Qt，也就是本仓库发的那个资产）。
      # 原来用的 aqtinstall 在 6.11 上必挂 —— Qt 从 6.9 起改了在线仓库目录布局，
      #     qt6_683/qt6_683/                  旧：一个目录装所有架构
      #     qt6_6111/qt6_6111_msvc2022_64/    新：按架构分子目录
      # aqt 3.3.0（PyPI 最新）仍按旧布局拼路径，报 "Failed to locate XML data"。
      # ★ 由此多了一条**顺序**约束：windows-arm64 要能编，windows-x64 的资产得先在。
      #   五套仍然并行、互不 needs —— arm64 没等到 x64 时会以一条明确的 ::error:: 收场，
      #   重跑一次即可，不值得为此把矩阵串起来。

      - name: Build static Qt
        id: qt
        if: steps.want.outputs.go == 'true'
        uses: ./coast/.github/actions/qt-static
        with:
          qt-version: ${{ github.event.inputs.qt-version || matrix.qt }}
          target: ${{ matrix.target }}
          # macOS 的 Qt 本身也必须是通用二进制，否则 app 那侧 -DCMAKE_OSX_ARCHITECTURES
          # 会因为链到单架构静态库而失败。部署目标要与 clashauto 的 macos job 一致。
          extra-cmake: ${{ matrix.target == 'macos-universal' && '-DCMAKE_OSX_ARCHITECTURES=x86_64;arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0' || '' }}
          # 本仓库没有并发组，可以放心干长活 —— 这正是把构建放这边的理由之一。
          build-deadline-min: '280'

      - name: Publish
        # 只在**这一轮真的编完**时发布。半份 Qt 传上去比没有更糟：下游会当成好东西下下来，
        # 然后在链接期以一堆缺符号收场 —— 而那时错因离现场已经隔了好几层。
        #
        # ★ prebuilt == 'true' 时跳过：这一轮根本没编，产物就是从本仓库自己的 release 下下来的，
        #   再打包重传只会得到一个内容相同、字节不同（tar 记时间戳）的包，sha256 变了，
        #   等于让所有下游平白重下几百 MB。
        if: >-
          steps.want.outputs.go == 'true' && steps.qt.outputs.complete == 'true'
          && steps.qt.outputs.prebuilt != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          QT_ROOT: ${{ steps.qt.outputs.qt-root }}
          RECIPE: ${{ steps.qt.outputs.recipe }}
          QTVER: ${{ github.event.inputs.qt-version || matrix.qt }}
        run: |
          set -euo pipefail
          asset="qtstatic-${QTVER}-${{ matrix.target }}-${RECIPE}.tar.gz"
          # ★ 路径先转 POSIX 再交给 tar。Windows runner 上 RUNNER_TEMP 是 D:\a\_temp，
          #   GNU tar 按 `host:path` 的老规矩（冒号在第一个斜杠之前）判定这是**远程归档**，
          #   于是去连接名为 D 的主机：
          #       tar (child): Cannot connect to D: resolve failed
          #       tar: D\:\\a\\_temp/qtstatic-….tar.gz: Cannot write: Broken pipe
          #   --force-local 能治，但那是 GNU 独有的 flag，macOS 的 bsdtar 见了直接报错，
          #   而这一步五套共用 —— 所以改路径。
          out="$RUNNER_TEMP/$asset"
          if command -v cygpath >/dev/null 2>&1; then out="$(cygpath -u "$RUNNER_TEMP")/$asset"; fi
          # -C "$QT_ROOT" . ：打包前缀的**内容**（含 .qtstatic-complete 这类点文件），
          # 解包端 tar -xzf 直接铺进前缀，不多一层目录。
          tar -czf "$out" -C "$QT_ROOT" .
          ls -lh "$out"
          tag="qt-${QTVER}"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
                 --title "Prebuilt static Qt $QTVER" \
                 --notes "由本仓库的 Build static Qt 自动发布。资产名里的短哈希 = clashauto 中对应平台配方脚本 sha256 的前 16 位，配方一改就是新资产。"
          gh release upload "$tag" "$out" --repo "$GITHUB_REPOSITORY" --clobber
          echo "::warning::已发布 $asset"

      - name: 没编完的说明
        # 让「这一轮没编完」在摘要里显性化。不说的话看到的是一个绿灯 job 和一个没变的 release，
        # 很容易以为发布成功了。
        if: steps.want.outputs.go == 'true' && steps.qt.outputs.complete != 'true'
        shell: bash
        run: |
          echo "::warning::${{ matrix.target }} 这一轮没编完（断点进度已进缓存）——再手动跑一次本 workflow 接着编"
